<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="D1srupt3d: Infrastructure, written like software.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="740" y1="0" x2="1010" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#d0d7de"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#ffffff"/>
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#d0d7de"/>

  <!-- Left: identity -->
  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="4" fill="url(#accent)">D1SRUPT3D</text>
  <text x="70" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1f2328">Infrastructure,</text>
  <text x="70" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1f2328">written like software.</text>
  <text x="72" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">Go  ·  Python  ·  Kubernetes  ·  OpenTofu  ·  Ansible</text>

  <!-- Right: how a change ships -->
  <g fill="none" stroke="url(#edge)" stroke-width="1.6" stroke-opacity="0.75">
    <path d="M748 150 H852"/>
    <path d="M868 150 C930 150, 940 82, 1002 82"/>
    <path d="M868 150 H1002"/>
    <path d="M868 150 C930 150, 940 218, 1002 218"/>
  </g>
  <g fill="none" stroke="#d0d7de" stroke-width="1.2">
    <path d="M1018 150 C1060 150, 1070 112, 1104 112"/>
    <path d="M1018 150 C1060 150, 1070 131, 1104 131"/>
    <path d="M1018 150 H1104"/>
    <path d="M1018 150 C1060 150, 1070 169, 1104 169"/>
    <path d="M1018 150 C1060 150, 1070 188, 1104 188"/>
  </g>

  <g stroke="url(#accent)" stroke-width="2" fill="#ffffff">
    <circle cx="740" cy="150" r="8"/>
    <circle cx="860" cy="150" r="8"/>
    <circle cx="1010" cy="82" r="8"/>
    <circle cx="1010" cy="150" r="8"/>
    <circle cx="1010" cy="218" r="8"/>
  </g>
  <g fill="#0891b2">
