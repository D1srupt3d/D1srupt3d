    <circle cx="860" cy="150" r="3"/>
    <circle cx="1010" cy="82" r="3"/>
    <circle cx="1010" cy="150" r="3"/>
    <circle cx="1010" cy="218" r="3"/>
  </g>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="1.4">
