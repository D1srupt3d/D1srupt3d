    <circle cx="1110" cy="131" r="4.5"/>
    <circle cx="1110" cy="150" r="4.5"/>
    <circle cx="1110" cy="169" r="4.5"/>
    <circle cx="1110" cy="188" r="4.5"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e">
    <text x="740" y="180" text-anchor="middle">signed</text>
    <text x="860" y="180" text-anchor="middle">deploy</text>
    <text x="1010" y="62" text-anchor="middle">vega</text>
